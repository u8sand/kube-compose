[project]
name = "kube-compose"
version = "0.12.0"
description = "An opinionated way of deploying docker-compose to kubernetes clusters by managing them with a helm chart."
authors = [
    {name = "Daniel J. B. Clarke",email = "u8sand@gmail.com"}
]
readme = "README.md"

requires-python = ">=3.10"
dependencies = [
    "click (>=8.2.1,<9.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "ruamel-yaml (>=0.18.14,<0.19.0)"
]

[project.scripts]
kube-compose = "kube_compose.__main__:cli"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# flat layout (kube_compose/ at the repo root rather than src/kube_compose/)
module-root = ""
