{{- define "env" -}}
env:
- null
{{- range $name, $value := .service.environment | default list }}
{{- if ne ($value | toJson) "null" }}
{{- if typeIs "int" $name }}
{{- $value_parsed := regexSplit "=" $value 2 }}
{{- $name := first $value_parsed }}
{{- $value := last $value_parsed }}
- name: {{ $name | toJson }}
  value: {{ $value | replace "$$" "$" | toJson }}
{{- else }}
- name: {{ $name | toJson }}
  value: {{ $value | replace "$$" "$" | toJson }}
{{- end }}
{{- end }}
{{- end }}
{{- end -}}

{{- define "ports" -}}
ports:
- null
{{- $seen := dict }}
{{- range $portIndex, $port := .service.ports | default list }}
{{- $portName := printf "%s-%v" (lower ($port.protocol | default "tcp")) $port.target }}
{{- if not (hasKey $seen $portName) }}
{{- $_ := set $seen $portName true }}
- name: {{ $portName }}
  containerPort: {{ $port.target }}
  protocol: {{ upper ($port.protocol | default "tcp") }}
  x_kubernetes: {{ index $port "x-kubernetes" | default dict | toJson }}
{{- end }}
{{- end }}
{{- /* `expose` ports are reachable by other services but not published, i.e. a Service port without ingress */}}
{{- range $expose := .service.expose | default list }}
{{- $parts := splitList "/" (toString $expose) }}
{{- $protocol := ternary (last $parts) "tcp" (gt (len $parts) 1) }}
{{- $portName := printf "%s-%s" (lower $protocol) (first $parts) }}
{{- if and (regexMatch "^[0-9]+$" (first $parts)) (not (hasKey $seen $portName)) }}
{{- $_ := set $seen $portName true }}
- name: {{ $portName }}
  containerPort: {{ first $parts }}
  protocol: {{ upper $protocol }}
  x_kubernetes: {}
{{- end }}
{{- end }}
{{- end -}}

{{- define "volumes" -}}
volumes:
- null
{{- range $volume := .service.volumes | default list }}
{{- $subPath := index (index (index (index $.Values.volumes | default dict) $volume.source | default dict) "x-kubernetes" | default dict) "subPath" }}
- name: {{ $volume.source }}
  mountPath: {{ $volume.target }}
{{- if eq $subPath "" }}
  subPath: ""
{{ else }}
  subPath: {{ $subPath | default "data" }}
{{- end }}
{{- end }}
{{- if .service.shm_size }}
- name: shm
  mountPath: /dev/shm
{{- end }}
{{- end -}}

{{- define "configs" -}}
configs:
- null
{{- range $volume := .service.configs | default list }}
- name: {{ $volume.source }}
  mountPath: {{ $volume.target }}
  subPath: content
{{- end }}
{{- end -}}

{{- define "tmpfs" -}}
tmpfs:
- null
{{- $tmpfs := .service.tmpfs | default list }}
{{- if kindIs "string" $tmpfs }}
{{- $tmpfs = list $tmpfs }}
{{- end }}
{{- range $index, $mount := $tmpfs }}
{{- $parts := splitList ":" $mount }}
- name: tmpfs-{{ $index }}
  mountPath: {{ first $parts | toJson }}
  {{- /* uid/gid/mode have no emptyDir equivalent (emptyDir is world-writable), only size is mapped */}}
  {{- range $option := splitList "," (join ":" (rest $parts)) }}
  {{- if hasPrefix "size=" $option }}
  {{- $size := trimPrefix "size=" $option }}
  {{- $num := regexFind "^[0-9]+" $size }}
  {{- $unit := upper (trimSuffix "b" (trimSuffix "B" (trimPrefix $num $size))) }}
  sizeLimit: {{ ternary (printf "%s%si" $num $unit) $num (has $unit (list "K" "M" "G" "T")) | toJson }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end -}}

{{- define "secrets" -}}
secrets:
- null
{{- range $index, $secret := .service.secrets | default list }}
{{- $source := "" }}
{{- $target := "" }}
{{- if kindIs "string" $secret }}
{{- $source = $secret }}
{{- else }}
{{- $source = $secret.source }}
{{- $target = $secret.target | default "" }}
{{- end }}
{{- $target = $target | default $source }}
{{- if not (hasPrefix "/" $target) }}
{{- $target = printf "/run/secrets/%s" $target }}
{{- end }}
- name: secret-{{ $index }}
  secretName: {{ $source }}
  mountPath: {{ $target | toJson }}
{{- end }}
{{- end -}}

{{- /* convert a compose duration (e.g. 1m30s, 500ms) to whole seconds (rounded up) */}}
{{- define "seconds" -}}
{{- $total := 0.0 }}
{{- $units := dict "h" 3600.0 "m" 60.0 "s" 1.0 "ms" 0.001 "us" 0.000001 "ns" 0.000000001 }}
{{- range $part := regexFindAll "[0-9.]+(ns|us|ms|s|m|h)" (toString .) -1 }}
{{- $num := regexFind "^[0-9.]+" $part }}
{{- $total = addf $total (mulf (float64 $num) (get $units (trimPrefix $num $part))) }}
{{- end }}
{{- ceil $total | int }}
{{- end -}}

{{- /* compose healthcheck => readinessProbe
  NOTE: docker doesn't restart unhealthy containers, so we intentionally do not map it to a livenessProbe */}}
{{- define "probe" -}}
{{- $healthcheck := .service.healthcheck | default dict }}
{{- $test := $healthcheck.test | default list }}
{{- if kindIs "string" $test }}
{{- $test = list "CMD-SHELL" $test }}
{{- end }}
{{- if and $test (not $healthcheck.disable) (has (first $test) (list "CMD" "CMD-SHELL")) }}
{{- $cmd := rest $test }}
{{- if eq (first $test) "CMD-SHELL" }}
{{- $cmd = list "/bin/sh" "-c" (join " " $cmd) }}
{{- end }}
{{- $command := list }}
{{- range $arg := $cmd }}
{{- $command = append $command (toString $arg | replace "$$" "$") }}
{{- end }}
probe:
  exec:
    command: {{ $command | toJson }}
  periodSeconds: {{ max 1 (include "seconds" ($healthcheck.interval | default "30s") | int) }}
  timeoutSeconds: {{ max 1 (include "seconds" ($healthcheck.timeout | default "30s") | int) }}
  failureThreshold: {{ $healthcheck.retries | default 3 | int }}
{{- end }}
{{- end -}}

{{- define "securityContext" -}}
{{- $securityContext := dict }}
{{- $user := splitList ":" (.service.user | default "" | toString) }}
{{- if regexMatch "^[0-9]+$" (first $user) }}
{{- $_ := set $securityContext "runAsUser" (first $user | int64) }}
{{- end }}
{{- if and (gt (len $user) 1) (regexMatch "^[0-9]+$" (last $user)) }}
{{- $_ := set $securityContext "runAsGroup" (last $user | int64) }}
{{- end }}
{{- if .service.privileged }}
{{- $_ := set $securityContext "privileged" true }}
{{- end }}
{{- if .service.read_only }}
{{- $_ := set $securityContext "readOnlyRootFilesystem" true }}
{{- end }}
{{- range $opt := .service.security_opt | default list }}
{{- if has $opt (list "no-new-privileges" "no-new-privileges:true" "no-new-privileges=true") }}
{{- $_ := set $securityContext "allowPrivilegeEscalation" false }}
{{- end }}
{{- end }}
{{- $capabilities := dict }}
{{- range $key, $caps := dict "drop" (.service.cap_drop | default list) "add" (.service.cap_add | default list) }}
{{- if $caps }}
{{- $list := list }}
{{- range $cap := $caps }}
{{- $list = append $list (trimPrefix "CAP_" (upper $cap)) }}
{{- end }}
{{- $_ := set $capabilities $key $list }}
{{- end }}
{{- end }}
{{- if $capabilities }}
{{- $_ := set $securityContext "capabilities" $capabilities }}
{{- end }}
securityContext: {{ $securityContext | toJson }}
{{- end -}}

{{- define "resources" -}}
{{- $limits := dict }}
{{- $requests := dict }}
{{- if .service.cpus }}
{{- $_ := set $limits "cpu" (toString .service.cpus) }}
{{- end }}
{{- if .service.mem_limit }}
{{- $_ := set $limits "memory" (printf "%d" (int64 .service.mem_limit)) }}
{{- end }}
{{- if .service.mem_reservation }}
{{- $_ := set $requests "memory" (printf "%d" (int64 .service.mem_reservation)) }}
{{- end }}
{{- $deployResources := (.service.deploy | default dict).resources | default dict }}
{{- range $key, $target := dict "limits" $limits "reservations" $requests }}
{{- with index $deployResources $key }}
{{- if .cpus }}
{{- $_ := set $target "cpu" (toString .cpus) }}
{{- end }}
{{- if .memory }}
{{- $_ := set $target "memory" (printf "%d" (int64 .memory)) }}
{{- end }}
{{- end }}
{{- end }}
{{- $resources := dict }}
{{- if $limits }}
{{- $_ := set $resources "limits" $limits }}
{{- end }}
{{- if $requests }}
{{- $_ := set $resources "requests" $requests }}
{{- end }}
resources: {{ $resources | toJson }}
{{- end -}}

{{- define "nodeSelector" -}}
{{- $nodeSelector := deepCopy (.x_kubernetes.nodeSelector | default dict) }}
{{- if .service.platform }}
{{- $platform := splitList "/" .service.platform }}
{{- $_ := set $nodeSelector "kubernetes.io/os" (first $platform) }}
{{- if gt (len $platform) 1 }}
{{- $_ := set $nodeSelector "kubernetes.io/arch" (index $platform 1) }}
{{- end }}
{{- end }}
nodeSelector: {{ $nodeSelector | toJson }}
{{- end -}}

{{- define "template" -}}
{{- $securityContext := (include "securityContext" . | fromYaml).securityContext }}
{{- $resources := (include "resources" . | fromYaml).resources }}
{{- $nodeSelector := (include "nodeSelector" . | fromYaml).nodeSelector }}
metadata:
  labels:
    app.kubernetes.io/name: {{ .name }}
spec:
  containers:
  - name: {{ .name }}
    image: {{ .service.image | toJson }}
    {{- if .x_kubernetes.imagePullPolicy }}
    imagePullPolicy: {{ .x_kubernetes.imagePullPolicy | toJson }}
    {{- else if eq .service.pull_policy "always" }}
    imagePullPolicy: "Always"
    {{- else if eq .service.pull_policy "if_not_present" }}
    imagePullPolicy: "IfNotPresent"
    {{- else if eq .service.pull_policy "missing" }}
    imagePullPolicy: "IfNotPresent"
    {{- else if eq .service.pull_policy "never" }}
    imagePullPolicy: "Never"
    {{- else }}
    imagePullPolicy: "Always"
    {{- end }}
    {{- if .service.entrypoint }}
    command: {{ .service.entrypoint | toJson }}
    {{- end }}
    {{- if .service.command }}
    args: {{ .service.command | toJson }}
    {{- end }}
    {{- if .env }}
    env:
{{ toYaml .env | indent 8 }}
    {{- end }}
    {{- if or .volumes .configs .tmpfs .secrets }}
    volumeMounts:
    {{- if .volumes }}
{{ toYaml .volumes | indent 8 }}
    {{- end }}
    {{- if .configs }}
{{ toYaml .configs | indent 8 }}
    {{- end }}
    {{- range $mount := .tmpfs }}
        - name: {{ $mount.name }}
          mountPath: {{ $mount.mountPath | toJson }}
    {{- end }}
    {{- range $secret := .secrets }}
        - name: {{ $secret.name }}
          mountPath: {{ $secret.mountPath | toJson }}
          subPath: content
          readOnly: true
    {{- end }}
    {{- end }}
    {{- if .ports }}
    ports:
{{- range $port := .ports }}
{{- if $port }}
    - name: {{ $port.name }}
      containerPort: {{ $port.containerPort }}
      protocol: {{ $port.protocol }}
{{- end }}
{{- end }}
    {{- end }}
    {{- with (include "probe" . | fromYaml).probe }}
    readinessProbe: {{ toYaml . | nindent 6 }}
    {{- end }}
    {{- if $securityContext }}
    securityContext: {{ toYaml $securityContext | nindent 6 }}
    {{- end }}
    {{- if $resources }}
    resources: {{ toYaml $resources | nindent 6 }}
    {{- end }}
  {{- if .x_kubernetes.priorityClassName }}
  priorityClassName: {{ .x_kubernetes.priorityClassName | toJson }}
  {{- end }}
  {{- if $nodeSelector }}
  nodeSelector: {{ toYaml $nodeSelector | nindent 4 }}
  {{- end }}
  dnsPolicy: {{ .x_kubernetes.dnsPolicy | default "ClusterFirst" }}
  {{- if .x_kubernetes.restartPolicy }}
  restartPolicy: {{ .x_kubernetes.restartPolicy }}
  {{- else if eq .service.restart "no" }}
  restartPolicy: "Never"
  {{- else if eq .service.restart "on-failure" }}
  restartPolicy: "OnFailure"
  {{- else if eq .service.restart "always" }}
  restartPolicy: "Always"
  {{- else if eq .service.restart "unless-stopped" }}
  restartPolicy: "Always"
  {{- else }}
  restartPolicy: "Always"
  {{- end }}
  {{- if .x_kubernetes.serviceAccountName }}
  serviceAccountName: {{ .x_kubernetes.serviceAccountName }}
  {{- end }}
  {{- if or .volumes .configs .tmpfs .secrets }}
  volumes:
  {{- if .volumes }}
  {{- range $vol := .service.volumes }}
  {{- $volName := index $vol "source" }}
  - name: {{ $volName }}
    persistentVolumeClaim:
      claimName: {{ $volName }}
  {{- end }}
  {{- if .service.shm_size }}
  - name: shm
    emptyDir:
      medium: Memory
      sizeLimit: {{ div (div .service.shm_size 1024) 1024 }}Mi
  {{- end }}
  {{- end }}
  {{- if .configs }}
  {{- range $vol := .configs }}
  {{- $volName := index $vol "name" }}
  - name: {{ $volName }}
    configMap:
      name: {{ $volName }}
  {{- end }}
  {{- end }}
  {{- range $mount := .tmpfs }}
  - name: {{ $mount.name }}
    emptyDir:
      medium: Memory
      {{- if $mount.sizeLimit }}
      sizeLimit: {{ $mount.sizeLimit | toJson }}
      {{- end }}
  {{- end }}
  {{- range $secret := .secrets }}
  - name: {{ $secret.name }}
    secret:
      secretName: {{ $secret.secretName }}
  {{- end }}
  {{- end }}
{{- end -}}


{{- range $name, $service := $.Values.services }}
{{- with dict "name" $name "service" $service "Values" $.Values }}
{{- $x_kubernetes := index .service "x-kubernetes" | default dict }}
{{- if not ($x_kubernetes.exclude | default false) }}
{{- $ports := slice (index ((include "ports" .) | fromYaml) "ports") 1 }}
{{- $env := slice (index ((include "env" .) | fromYaml) "env") 1 }}
{{- $volumes := slice (index ((include "volumes" .) | fromYaml) "volumes") 1 }}
{{- $configs := slice (index ((include "configs" .) | fromYaml) "configs") 1 }}
{{- $tmpfs := slice (index ((include "tmpfs" .) | fromYaml) "tmpfs") 1 }}
{{- $secrets := slice (index ((include "secrets" .) | fromYaml) "secrets") 1 }}
{{ with merge . (dict "x_kubernetes" $x_kubernetes "ports" $ports "env" $env "volumes" $volumes "configs" $configs "tmpfs" $tmpfs "secrets" $secrets) }}
---
{{- if eq ($x_kubernetes.cron | default "") "" }}
apiVersion: apps/v1
{{- if eq ((.service.deploy | default dict).mode | default "") "global" }}
kind: DaemonSet
{{- else }}
kind: Deployment
{{- end }}
metadata:
  {{- if $x_kubernetes.labels }}
  labels:
{{ toYaml $x_kubernetes.labels | indent 4 }}
  {{- end }}
  {{- if $x_kubernetes.annotations }}
  annotations:
{{ toYaml $x_kubernetes.annotations | indent 4 }}
  {{- end }}
  name: {{ $name }}
spec:
  replicas: {{ (.service.deploy | default dict).replicas | default 1 }}
  {{- if $x_kubernetes.strategy }}
  strategy:
{{ toYaml $x_kubernetes.strategy | indent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
{{ toYaml ((include "template" .) | fromYaml) | indent 4 }}

{{- /* a Service is always created so the compose service name resolves in DNS like it would on a compose network,
  services without ports get a headless Service (DNS resolves directly to the pod IPs, so any port is reachable) */}}
---
apiVersion: v1
kind: Service
metadata:
  {{- if $x_kubernetes.labels }}
  labels:
{{ toYaml $x_kubernetes.labels | indent 4 }}
  {{- end }}
  {{- if $x_kubernetes.annotations }}
  annotations:
{{ toYaml $x_kubernetes.annotations | indent 4 }}
  {{- end }}
  name: {{ $name }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  {{- if $ports }}
  {{- if $x_kubernetes.serviceType }}
  type: {{ $x_kubernetes.serviceType }}
  {{- end }}
  ports:
{{- range $port := $ports }}
    - name: {{ $port.name }}
      protocol: {{ $port.protocol }}
      port: {{ $port.containerPort }}
      targetPort: {{ $port.containerPort }}
{{- end }}
  {{- else }}
  clusterIP: None
  {{- end }}

{{- range $port := $ports }}
{{- if $port.x_kubernetes }}
{{- $portLabels := merge ($port.x_kubernetes.labels | default dict) ($x_kubernetes.labels | default dict) }}
{{- $portAnnotations := merge ($port.x_kubernetes.annotations | default dict) ($x_kubernetes.annotations | default dict) }}
---
apiVersion: v1
kind: Service
metadata:
  {{- if $portLabels }}
  labels:
{{ toYaml $portLabels | indent 4 }}
  {{- end }}
  {{- if $portAnnotations }}
  annotations:
{{ toYaml $portAnnotations | indent 4 }}
  {{- end }}
  name: {{ $name }}-{{ .name }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: {{ $port.name }}
      protocol: {{ $port.protocol }}
      port: {{ $port.containerPort }}
      targetPort: {{ $port.containerPort }}
{{- end }}
{{- end }}

{{- else }}
apiVersion: batch/v1
kind: CronJob
metadata:
  {{- if $x_kubernetes.labels }}
  labels:
{{ toYaml $x_kubernetes.labels | indent 4 }}
  {{- end }}
  {{- if $x_kubernetes.annotations }}
  annotations:
{{ toYaml $x_kubernetes.annotations | indent 4 }}
  {{- end }}
  name: {{ $name }}
spec:
  schedule: {{ $x_kubernetes.cron }}
  jobTemplate:
    spec:
      template:
{{ toYaml ((include "template" .) | fromYaml) | indent 8 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}

{{- if (index $.Values "x-kubernetes" | default dict).apply }}
{{- $x_kubernetes := index $.Values "x-kubernetes" }}
---
{{ $x_kubernetes.apply }}
{{- end }}
